[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "freevoicetranscribe"
version = "2.0.0"
description = "Private local hold-to-talk dictation for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{ name = "Steve Defendre" }]
dependencies = [
    "lightning-whisper-mlx==0.0.10",
    "numpy==2.4.2",
    "PyAudio==0.2.14",
    "pynput==1.8.1",
    "pyobjc-framework-ApplicationServices==12.1",
    "pyobjc-framework-Cocoa==12.1",
    "pyobjc-framework-Quartz==12.1",
    "rumps==0.4.0",
]

[project.optional-dependencies]
build = ["py2app==0.28.9"]
dev = ["ruff==0.14.13"]

[project.scripts]
freevoicetranscribe = "fvt.app:main"

[tool.setuptools.packages.find]
include = ["fvt*"]

[tool.freevoicetranscribe]
runtime-requirements = "requirements.txt"
runtime-lock = "requirements.lock"
build-lock = "requirements-build.lock"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

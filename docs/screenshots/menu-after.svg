<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-label="Menu bar after adding Mode and Writing Preferences">
  <rect width="720" height="520" fill="#f4f4f5"/>
  <text x="36" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#18181b">After: menu bar</text>
  <text x="36" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#52525b">Illustrative mock. Not captured from a running Mac.</text>
  <rect x="80" y="96" width="320" height="388" rx="12" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="100" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#18181b">Ready</text>
  <text x="100" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#52525b">Hold fn and speak. Release to insert.</text>
  <line x1="100" y1="172" x2="380" y2="172" stroke="#e4e4e7"/>
  <text x="100" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">Mode</text>
  <text x="360" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#71717a">:</text>
  <text x="100" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">Writing Preferences&</text>
  <line x1="100" y1="244" x2="380" y2="244" stroke="#e4e4e7"/>
  <text x="100" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">Copy Last Transcript</text>
  <text x="100" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">Insert Last Transcript</text>
  <line x1="100" y1="316" x2="380" y2="316" stroke="#e4e4e7"/>
  <text x="100" y="344" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">Open Setup&</text>
  <text x="100" y="372" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a1a1aa">Dismiss Error</text>
  <line x1="100" y1="388" x2="380" y2="388" stroke="#e4e4e7"/>
  <text x="100" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">Quit</text>
  <rect x="412" y="168" width="228" height="128" rx="12" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="432" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">  Dictate</text>
  <text x="432" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">    Write</text>
  <text x="432" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">    Command</text>
  <text x="432" y="278" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#71717a">Dictate stays raw.</text>
</svg>

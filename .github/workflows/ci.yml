name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Shell syntax
        run: bash -n run.sh build_app.sh

  python311-check:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate build interpreter assumption
        run: python3 scripts/validate_build_python.py
